<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mental Omega Randomizer</title>
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/components.css">
</head>
<body>
  <!-- Three bands and nothing else. The mode sits in the first because it
       decides what is in the second, and the second decides what is in the
       third. Tabs and screens are drawn from what the launcher says the
       mode has, so this page names no mode and no screen. -->
  <div class="app">
    <header class="titlebar">
      <span class="titlebar__name">Mental Omega Randomizer</span>
      <label class="titlebar__mode">
        <span class="titlebar__mode-label">Mode</span>
        <select id="mode"></select>
      </label>
      <span class="titlebar__spacer"></span>
      <span class="titlebar__status" id="status"></span>
    </header>

    <nav class="tabs" id="tabs" role="tablist"></nav>

    <main class="screens" id="screens"></main>
  </div>

  <script type="module" src="views/skirmish.js"></script>
  <script type="module" src="views/setup.js"></script>
  <script type="module" src="views/records.js"></script>
  <script type="module" src="views/classic.js"></script>
  <script type="module" src="views/launcher.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
