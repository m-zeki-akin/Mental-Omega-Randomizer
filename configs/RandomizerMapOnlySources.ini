; Reviewed source TechnoTypes that exist only inside campaign, challenge and
; cooperative maps -- never in rulesmo.ini, so nothing at runtime can look them
; up. Every other player clone is built from the installed rules; these six are
; the whole reason a committed roster file still exists.
;
; Bodies are verbatim map sections. The reviewed clone policy in
; randomizer/rewards/template_policy.py is applied to them at load, exactly as
; it is to an installed section, so a change in policy reaches these units too.
;
; Sources: Mental Omega 3.3.6 Foehn mission FCAPSULE (Brutes),
; MapsMO/Challenge/c_revolution.map (Boris, Kirov Command Airship),
; MapsMO/Cooperative/coop_sthunder.map (Super Thor).

